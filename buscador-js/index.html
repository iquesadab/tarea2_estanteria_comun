<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estantería Común</title>

    <!-- CSS compilado desde Sass -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="bg-primary text-white py-4">
        <div class="container">
            <h1>Estantería Común</h1>
            <p class="mb-0">Un espacio para descubrir y compartir libros.</p>
        </div>
    </header>

    <main class="container my-5">

        <section class="bienvenida">

            <h2>Bienvenidos a nuestro club de lectura</h2>

            <p>
                Explora libros, descubre nuevas historias y organiza tus lecturas.
            </p>

            <button class="btn btn-primary">
                Buscar libros
            </button>

        </section>

    </main>

</body>

</html>
